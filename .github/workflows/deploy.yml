name: Build and Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/shawket4/sufrix-whatsapp

jobs:
  build-push:
    name: build + push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      sha_tag: ${{ env.IMAGE }}:sha-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy to VPS
    needs: build-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Pull image and restart
        env:
          DEPLOY_IMAGE: ${{ env.IMAGE }}:sha-${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/deploy_key -p 22 root@187.124.33.153 \
              "DEPLOY_IMAGE='${DEPLOY_IMAGE}' GHCR_TOKEN='${GHCR_TOKEN}' GH_ACTOR='${GH_ACTOR}' bash -s" << 'SCRIPT'
          set -e

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker pull "$DEPLOY_IMAGE"

          WHATSAPP_IMAGE="$DEPLOY_IMAGE" \
            docker compose -f /opt/sufrix-rust/docker-compose.yml \
            up -d --no-deps --pull never sufrix-whatsapp

          sleep 3
          docker compose -f /opt/sufrix-rust/docker-compose.yml \
            ps sufrix-whatsapp | grep -q "Up" && echo "✅ whatsapp up" || {
            docker compose -f /opt/sufrix-rust/docker-compose.yml \
              logs sufrix-whatsapp --tail 30
            exit 1
          }
          SCRIPT
